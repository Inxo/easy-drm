services:
  # App
  nulljet-stream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nulljet-stream
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./logs/:/app/logs/
      - ./data/:/app/data/
    networks:
      - nulljet-app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nginx reverse proxy
  webserver:
    image: nginx:alpine
    container_name: nulljet-stream-webserver
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - nulljet-app-network
    depends_on:
      nulljet-stream:
        condition: service_healthy

networks:
  nulljet-app-network:
    driver: bridge
